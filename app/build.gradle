plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def env = { String key, String fallback -> System.getenv(key) ?: project.findProperty(key) ?: fallback }

android {
    namespace 'com.noorwallet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noorwallet.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            def store = env('ANDROID_KEYSTORE_PATH', '')
            if (store) {
                storeFile file(store)
                storePassword env('ANDROID_KEYSTORE_PASSWORD', '')
                keyAlias env('ANDROID_KEY_ALIAS', '')
                keyPassword env('ANDROID_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // لا تراجع صامت لتوقيع debug: إن غاب الـ Keystore الحقيقي، يفشل البناء
            // بوضوح بدل إنتاج APK "release" موقّع فعلياً بمفتاح debug غير الآمن.
            // للتجاوز المتعمد أثناء الاختبار المحلي فقط:
            //   gradle :app:assembleRelease -PallowDebugSigningForRelease
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            } else if (project.hasProperty('allowDebugSigningForRelease')) {
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    "بناء release بلا Keystore حقيقي. عرّف ANDROID_KEYSTORE_PATH/PASSWORD/" +
                    "ANDROID_KEY_ALIAS/PASSWORD، أو مرّر -PallowDebugSigningForRelease " +
                    "لتجاوز الفحص عمداً لأغراض الاختبار المحلي فقط (لا يُستخدم للنشر أبداً)."
                )
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
}